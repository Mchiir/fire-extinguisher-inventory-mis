services:
  gateway:
    image: nginx:alpine
    container_name: fire-extinguisher-gateway
    ports:
      - "8888:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - product-service
      - inventory-service
      - client-service
      - assignment-service
      - notification-service
      - report-service
    networks:
      - fire-extinguisher-network

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    environment:
      PORT: 3001
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/auth-db
      JWT_SECRET: change-me-access-secret
      REFRESH_TOKEN_SECRET: change-me-refresh-secret
      CLIENT_URL: http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
    networks:
      - fire-extinguisher-network

  user-service:
    build: ./services/user-service
    container_name: user-service
    environment:
      PORT: 3002
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/user-db
      JWT_SECRET: change-me-access-secret
      CLIENT_URL: http://localhost:5173
    ports:
      - "3002:3002"
    depends_on:
      - mongodb
    networks:
      - fire-extinguisher-network

  product-service:
    build: ./services/product-service
    container_name: product-service
    environment:
      PORT: 3003
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/product-db
      JWT_SECRET: change-me-access-secret
      CLIENT_URL: http://localhost:5173
    ports:
      - "3003:3003"
    depends_on:
      - mongodb
    networks:
      - fire-extinguisher-network

  inventory-service:
    build: ./services/inventory-service
    container_name: inventory-service
    environment:
      PORT: 3004
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/inventory-db
      JWT_SECRET: change-me-access-secret
      CLIENT_URL: http://localhost:5173
    ports:
      - "3004:3004"
    depends_on:
      - mongodb
    networks:
      - fire-extinguisher-network

  client-service:
    build: ./services/client-service
    container_name: client-service
    environment:
      PORT: 3005
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/client-db
      JWT_SECRET: change-me-access-secret
      CLIENT_URL: http://localhost:5173
    ports:
      - "3005:3005"
    depends_on:
      - mongodb
    networks:
      - fire-extinguisher-network

  assignment-service:
    build: ./services/assignment-service
    container_name: assignment-service
    environment:
      PORT: 3006
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/assignment-db
      JWT_SECRET: change-me-access-secret
      CLIENT_URL: http://localhost:5173

      CLIENT_SERVICE_URL: http://client-service:3005
      INVENTORY_SERVICE_URL: http://inventory-service:3004
    ports:
      - "3006:3006"
    depends_on:
      - mongodb
      - client-service
      - inventory-service
    networks:
      - fire-extinguisher-network

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    environment:
      PORT: 3007
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/notification-db
      JWT_SECRET: change-me-access-secret
      CLIENT_URL: http://localhost:5173

      ASSIGNMENT_SERVICE_URL: http://assignment-service:3006
      CLIENT_SERVICE_URL: http://client-service:3005
    ports:
      - "3007:3007"
    depends_on:
      - mongodb
      - assignment-service
      - client-service
    networks:
      - fire-extinguisher-network

  report-service:
    build: ./services/report-service
    container_name: report-service
    environment:
      PORT: 3008
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/report-db
      JWT_SECRET: change-me-access-secret
      CLIENT_URL: http://localhost:5173

      INVENTORY_SERVICE_URL: http://inventory-service:3004
      ASSIGNMENT_SERVICE_URL: http://assignment-service:3006
      CLIENT_SERVICE_URL: http://client-service:3005
    ports:
      - "3008:3008"
    depends_on:
      - mongodb
      - inventory-service
      - assignment-service
      - client-service
    networks:
      - fire-extinguisher-network

  mongodb:
    image: mongo:7
    container_name: fire-extinguisher-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - fire-extinguisher-network

volumes:
  mongodb_data:

networks:
  fire-extinguisher-network:
    driver: bridge