services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - product-service
      - inventory-service
      - client-service
      - assignment-service
      - notification-service
      - report-service

  auth-service:
    build: ./services/auth-service
    environment:
      - MONGO_URI=mongodb://mongodb:27017/auth-db
      - JWT_SECRET=supersecretjwtkey
      - REFRESH_TOKEN_SECRET=supersecretrefreshkey
      - PORT=3001
    ports:
      - "3001:3001"
    depends_on:
      - mongodb

  user-service:
    build: ./services/user-service
    environment:
      - MONGO_URI=mongodb://mongodb:27017/user-db
      - PORT=3002
    ports:
      - "3002:3002"
    depends_on:
      - mongodb

  product-service:
    build: ./services/product-service
    environment:
      - MONGO_URI=mongodb://mongodb:27017/product-db
      - PORT=3003
    ports:
      - "3003:3003"
    depends_on:
      - mongodb

  inventory-service:
    build: ./services/inventory-service
    environment:
      - MONGO_URI=mongodb://mongodb:27017/inventory-db
      - PORT=3004
    ports:
      - "3004:3004"
    depends_on:
      - mongodb

  client-service:
    build: ./services/client-service
    environment:
      - MONGO_URI=mongodb://mongodb:27017/client-db
      - PORT=3005
    ports:
      - "3005:3005"
    depends_on:
      - mongodb

  assignment-service:
    build: ./services/assignment-service
    environment:
      - MONGO_URI=mongodb://mongodb:27017/assignment-db
      - PORT=3006
      - CLIENT_SERVICE_URL=http://client-service:3005
      - INVENTORY_SERVICE_URL=http://inventory-service:3004
    ports:
      - "3006:3006"
    depends_on:
      - mongodb

  notification-service:
    build: ./services/notification-service
    environment:
      - MONGO_URI=mongodb://mongodb:27017/notification-db
      - PORT=3007
      - ASSIGNMENT_SERVICE_URL=http://assignment-service:3006
      - CLIENT_SERVICE_URL=http://client-service:3005
    ports:
      - "3007:3007"
    depends_on:
      - mongodb

  report-service:
    build: ./services/report-service
    environment:
      - MONGO_URI=mongodb://mongodb:27017/report-db
      - PORT=3008
      - INVENTORY_SERVICE_URL=http://inventory-service:3004
      - ASSIGNMENT_SERVICE_URL=http://assignment-service:3006
      - CLIENT_SERVICE_URL=http://client-service:3005
    ports:
      - "3008:3008"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
